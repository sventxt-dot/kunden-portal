<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Messerich Catering — Assistenten</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary:   #8b2a3a;
    --primary-h: #6e2030;
    --primary-light: #f5eaec;
    --accent:    #9a9a9a;
    --bg:        #f4f5f7;
    --surface:   #ffffff;
    --border:    #e2e4e9;
    --text:      #1a1d23;
    --muted:     #6b7280;
    --user-bg:   #8b2a3a;
    --bot-bg:    #f0f2f5;
    --radius:    12px;
  }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

  .screen { display: none; height: 100vh; }
  .screen.active { display: flex; }

  /* ── LOGIN ── */
  #login-screen {
    align-items: center; justify-content: center;
    background: linear-gradient(135deg, #3a1020 0%, #8b2a3a 100%);
  }
  .login-card {
    background: var(--surface); border-radius: 20px;
    padding: 40px 40px 48px; width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    display: flex; flex-direction: column; gap: 20px;
    align-items: center;
  }
  .login-logo { width: 160px; object-fit: contain; margin-bottom: 4px; }
  .login-divider { width: 100%; height: 1px; background: var(--border); }
  .login-card h2 { font-size: 1rem; font-weight: 600; color: var(--muted); letter-spacing: .03em; }
  .login-card input {
    width: 100%; padding: 12px 16px; border: 1.5px solid var(--border);
    border-radius: var(--radius); font-size: 1rem; outline: none;
    transition: border-color .2s; font-family: inherit;
  }
  .login-card input:focus { border-color: var(--primary); }
  .login-fields { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  .login-card button {
    width: 100%; padding: 13px; background: var(--primary); color: #fff;
    border: none; border-radius: var(--radius); font-size: 1rem;
    font-weight: 600; cursor: pointer; transition: background .2s; font-family: inherit;
  }
  .login-card button:hover { background: var(--primary-h); }
  .login-error { color: #dc2626; font-size: .85rem; text-align: center; display: none; }

  /* ── APP ── */
  #app-screen { flex-direction: row; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 280px; min-width: 280px; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; height: 100vh;
  }
  .sidebar-logo-wrap {
    padding: 20px 20px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
  }
  .sidebar-logo { width: 130px; object-fit: contain; }

  .section-label {
    font-size: .7rem; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em;
    padding: 16px 20px 8px;
  }

  .agent-btn {
    width: 100%; display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border: none; background: none;
    cursor: pointer; text-align: left; transition: background .15s;
    margin: 1px 0;
  }
  .agent-btn:hover { background: var(--bg); }
  .agent-btn.active { background: var(--primary-light); }
  .agent-icon {
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.15rem; flex-shrink: 0;
  }
  .agent-info strong { font-size: .88rem; display: block; }
  .agent-info span { font-size: .75rem; color: var(--muted); }

  /* Archive */
  .archive-wrap { flex: 1; overflow-y: auto; border-top: 1px solid var(--border); }
  .archive-item {
    width: 100%; display: flex; align-items: flex-start; gap: 10px;
    padding: 9px 14px; border: none; background: none;
    cursor: pointer; text-align: left; transition: background .15s;
  }
  .archive-item:hover { background: var(--bg); }
  .archive-item.active { background: var(--primary-light); }
  .archive-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
  .archive-info strong { font-size: .82rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
  .archive-info span { font-size: .72rem; color: var(--muted); }
  .archive-empty { font-size: .82rem; color: var(--muted); padding: 12px 20px; }

  .sidebar-footer {
    padding: 14px 16px; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar-footer span { font-size: .82rem; color: var(--muted); }
  .logout-btn {
    font-size: .8rem; color: var(--muted); background: none;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 10px; cursor: pointer; transition: all .15s; font-family: inherit;
  }
  .logout-btn:hover { color: var(--primary); border-color: var(--primary); }

  /* ── MAIN ── */
  .main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  .welcome-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; color: var(--muted);
  }
  .welcome-logo { width: 180px; opacity: .25; }
  .welcome-state h2 { font-size: 1.2rem; font-weight: 600; color: var(--text); }
  .welcome-state p { font-size: .9rem; max-width: 320px; text-align: center; line-height: 1.6; }

  /* Chat header */
  .chat-header {
    padding: 14px 24px; border-bottom: 1px solid var(--border);
    background: var(--surface); display: flex; align-items: center;
    gap: 14px; flex-shrink: 0;
  }
  .chat-header-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
  .chat-header-info h3 { font-size: 1rem; font-weight: 700; }
  .chat-header-info span { font-size: .8rem; color: var(--muted); }
  .new-chat-btn {
    margin-left: auto; padding: 8px 16px; background: var(--primary);
    color: #fff; border: none; border-radius: 8px; font-size: .85rem;
    font-weight: 600; cursor: pointer; transition: background .2s; font-family: inherit;
  }
  .new-chat-btn:hover { background: var(--primary-h); }

  /* Messages */
  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 10px; max-width: 78%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.bot  { align-self: flex-start; }
  .msg-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: .9rem; flex-shrink: 0; margin-top: 2px;
  }
  .msg.user .msg-avatar { background: var(--primary); color: #fff; }
  .msg.bot  .msg-avatar { background: var(--bot-bg); }
  .msg-bubble {
    padding: 11px 15px; border-radius: 16px;
    font-size: .9rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .msg-bubble { background: var(--user-bg); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot  .msg-bubble { background: var(--bot-bg); color: var(--text); border-bottom-left-radius: 4px; }
  .msg-time { font-size: .7rem; color: var(--muted); margin-top: 4px; }
  .msg.user .msg-time { text-align: right; }

  /* Typing */
  .typing { display: flex; gap: 5px; align-items: center; padding: 12px 15px; }
  .typing span { width: 7px; height: 7px; background: var(--muted); border-radius: 50%; animation: bounce .9s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

  /* Input */
  .input-area { padding: 16px 24px 20px; border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
  .input-row {
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--bg); border: 1.5px solid var(--border);
    border-radius: 14px; padding: 10px 14px; transition: border-color .2s;
  }
  .input-row:focus-within { border-color: var(--primary); }
  #msg-input {
    flex: 1; border: none; background: none; outline: none;
    font-size: .95rem; resize: none; max-height: 120px; font-family: inherit; line-height: 1.5;
  }
  .send-btn {
    width: 36px; height: 36px; background: var(--primary); color: #fff;
    border: none; border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background .2s; font-size: 1rem;
  }
  .send-btn:hover { background: var(--primary-h); }
  .send-btn:disabled { background: var(--border); cursor: not-allowed; }
  .input-hint { font-size: .72rem; color: var(--muted); margin-top: 6px; padding-left: 4px; }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
</style>
</head>

      </div>
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <div class="pdf-preview" id="pdf-preview">
          <span class="pdf-preview-name" id="pdf-name"></span>
          <span class="pdf-preview-size" id="pdf-size"></span>
          <button class="pdf-remove" onclick="removePdf()" title="Entfernen">✕</button>
        </div>
        <div class="input-row">
          <input type="file" id="pdf-input" accept="application/pdf" style="display:none" onchange="handlePdf(this)">
          <button class="pdf-btn" id="pdf-btn" onclick="document.getElementById('pdf-input').click()" title="PDF anhängen">📎</button>
          <textarea id="msg-input" rows="1" placeholder="Nachricht eingeben…"></textarea>
          <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
        </div>
        <div class="input-hint">Enter zum Senden · Shift+Enter neue Zeile · 📎 PDF anhängen</div>
      </div>
    </div>
  </main>
</div>

<script>
const CONFIG = {
  users: {
    "demo": "demo"
  },
  agents: [
    {
      id: "agent-kueche",
      name: "Küchen-Assistent",
      description: "Einkaufslisten & Menüplanung",
      icon: "🍽️",
      color: "#f5eaec",
      chatflowId: "26ade53e-ce20-40d7-a7bd-c1435d32a278",
      flowiseUrl: "http://flowise-tvkk0ssj3mlrvabws2x0n8cp.178.104.67.188.sslip.io/api/v1/prediction/"
    },
    {
      id: "agent-operativ",
      name: "Operativer Assistent",
      description: "Operative Planung & Organisation",
      icon: "📋",
      color: "#eaf0f5",
      chatflowId: "0138059a-96d0-4462-9deb-c8c91ae22370",
      flowiseUrl: "http://flowise-tvkk0ssj3mlrvabws2x0n8cp.178.104.67.188.sslip.io/api/v1/prediction/"
    }
  ],
  flowiseApiKey: ""
};

let state = {
  user: null, activeAgent: null,
  activeSessionId: null, sessions: {}, isLoading: false
};

function saveToStorage() {
  localStorage.setItem("mc_sessions_" + state.user, JSON.stringify(state.sessions));
}
function loadFromStorage(user) {
  const raw = localStorage.getItem("mc_sessions_" + user);
  return raw ? JSON.parse(raw) : {};
}

function doLogin() {
  const u = document.getElementById("login-user").value.trim();
  const p = document.getElementById("login-pass").value;
  const err = document.getElementById("login-error");
  if (CONFIG.users[u] && CONFIG.users[u] === p) {
    err.style.display = "none";
    state.user = u;
    state.sessions = loadFromStorage(u);
    document.getElementById("user-label").textContent = "👤 " + u;
    showScreen("app-screen");
    renderAgents();
    renderArchive();
  } else {
    err.style.display = "block";
  }
}

function doLogout() {
  state = { user: null, activeAgent: null, activeSessionId: null, sessions: {}, isLoading: false };
  document.getElementById("login-user").value = "";
  document.getElementById("login-pass").value = "";
  showScreen("login-screen");
}

document.getElementById("login-pass").addEventListener("keydown", e => {
  if (e.key === "Enter") doLogin();
});

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function renderAgents() {
  const list = document.getElementById("agent-list");
  list.innerHTML = "";
  CONFIG.agents.forEach(agent => {
    const btn = document.createElement("button");
    btn.className = "agent-btn" + (state.activeAgent?.id === agent.id ? " active" : "");
    btn.innerHTML = `
      <div class="agent-icon" style="background:${agent.color}">${agent.icon}</div>
      <div class="agent-info">
        <strong>${agent.name}</strong>
        <span>${agent.description}</span>
      </div>`;
    btn.onclick = () => selectAgent(agent);
    list.appendChild(btn);
  });
}

function selectAgent(agent) {
  state.activeAgent = agent;
  state.activeSessionId = null;
  renderAgents();
  showChatView(agent);
  renderMessages();
}

function showChatView(agent) {
  document.getElementById("welcome-state").style.display = "none";
  const cv = document.getElementById("chat-view");
  cv.style.display = "flex";
  document.getElementById("header-icon").textContent = agent.icon;
  document.getElementById("header-icon").style.background = agent.color;
  document.getElementById("header-name").textContent = agent.name;
  document.getElementById("header-desc").textContent = agent.description;
}

function newChat() {
  if (!state.activeAgent) return;
  state.activeSessionId = null;
  renderMessages();
  renderArchive();
}

function renderArchive() {
  const list = document.getElementById("archive-list");
  const sessions = Object.values(state.sessions).sort((a,b) => b.updatedAt - a.updatedAt);
  if (sessions.length === 0) {
    list.innerHTML = '<p class="archive-empty">Noch keine Chats.</p>';
    return;
  }
  list.innerHTML = "";
  sessions.forEach(sess => {
    const agent = CONFIG.agents.find(a => a.id === sess.agentId);
    const btn = document.createElement("button");
    btn.className = "archive-item" + (state.activeSessionId === sess.id ? " active" : "");
    const date = new Date(sess.updatedAt).toLocaleDateString("de-DE", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
    btn.innerHTML = `
      <div class="archive-dot" style="background:${agent?.color || '#ccc'}; border: 1px solid #ccc;"></div>
      <div class="archive-info">
        <strong>${sess.title}</strong>
        <span>${agent?.icon || ""} ${agent?.name || "Unbekannt"} · ${date}</span>
      </div>`;
    btn.onclick = () => loadSession(sess.id);
    list.appendChild(btn);
  });
}

function loadSession(sessionId) {
  const sess = state.sessions[sessionId];
  if (!sess) return;
  const agent = CONFIG.agents.find(a => a.id === sess.agentId);
  if (!agent) return;
  state.activeAgent = agent;
  state.activeSessionId = sessionId;
  renderAgents();
  showChatView(agent);
  renderMessages();
  renderArchive();
}

function renderMessages() {
  const container = document.getElementById("messages");
  container.innerHTML = "";
  if (!state.activeSessionId) {
    const agent = state.activeAgent;
    appendMessage("bot", `Hallo! Ich bin der ${agent.name} von Messerich Catering. ${agent.description}. Wie kann ich dir helfen?`, Date.now());
    return;
  }
  const sess = state.sessions[state.activeSessionId];
  if (!sess) return;
  sess.messages.forEach(m => appendMessage(m.role, m.content, m.ts));
  scrollToBottom();
}

function appendMessage(role, content, ts) {
  const container = document.getElementById("messages");
  const agent = state.activeAgent;
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const avatar = document.createElement("div");
  avatar.className = "msg-avatar";
  avatar.textContent = role === "user" ? "👤" : (agent?.icon || "🤖");
  if (role === "bot") avatar.style.background = agent?.color || "#f0f2f5";
  const inner = document.createElement("div");
  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";
  bubble.textContent = content;
  const time = document.createElement("div");
  time.className = "msg-time";
  time.textContent = new Date(ts).toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" });
  inner.appendChild(bubble);
  inner.appendChild(time);
  wrap.appendChild(avatar);
  wrap.appendChild(inner);
  container.appendChild(wrap);
  scrollToBottom();
}

function appendTyping() {
  const container = document.getElementById("messages");
  const wrap = document.createElement("div");
  wrap.className = "msg bot";
  wrap.id = "typing-indicator";
  const avatar = document.createElement("div");
  avatar.className = "msg-avatar";
  avatar.textContent = state.activeAgent?.icon || "🤖";
  avatar.style.background = state.activeAgent?.color || "#f0f2f5";
  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  container.appendChild(wrap);
  scrollToBottom();
}

function removeTyping() {
  const el = document.getElementById("typing-indicator");
  if (el) el.remove();
}

function scrollToBottom() {
  const c = document.getElementById("messages");
  c.scrollTop = c.scrollHeight;
}


  function handlePdf(input) {
    const file = input.files[0];
    if (!file) return;
    if (file.type !== "application/pdf") { alert("Bitte nur PDF-Dateien."); return; }
    if (file.size > 20 * 1024 * 1024) { alert("PDF zu groß (max. 20 MB)."); return; }
    const reader = new FileReader();
    reader.onload = function(e) {
      const base64 = e.target.result.split(",")[1];
      state.pendingPdf = { name: file.name, size: fmtSize(file.size), base64: base64 };
      document.getElementById("pdf-name").textContent = file.name;
      document.getElementById("pdf-size").textContent = fmtSize(file.size);
      document.getElementById("pdf-preview").classList.add("visible");
      document.getElementById("pdf-btn").classList.add("has-file");
    };
    reader.readAsDataURL(file);
    input.value = "";
  }

  function removePdf() {
    state.pendingPdf = null;
    document.getElementById("pdf-preview").classList.remove("visible");
    document.getElementById("pdf-btn").classList.remove("has-file");
    document.getElementById("pdf-input").value = "";
  }

  function fmtSize(b) {
    if (b < 1024) return b + " B";
    if (b < 1048576) return (b/1024).toFixed(1) + " KB";
    return (b/1048576).toFixed(1) + " MB";
  }

async function sendMessage() {
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  const pdf = state.pendingPdf;
  if ((!text && !pdf) || state.isLoading || !state.activeAgent) return;
  input.value = "";
  input.style.height = "auto";
  state.isLoading = true;
  document.getElementById("send-btn").disabled = true;
  const ts = Date.now();
  removePdf();

  if (!state.activeSessionId) {
    const sessionId = "sess_" + ts + "_" + Math.random().toString(36).slice(2,7);
    state.activeSessionId = sessionId;
    const title = text ? text.slice(0, 40) + (text.length > 40 ? "…" : "") : (pdf ? "📄 " + pdf.name : "Neuer Chat");
    state.sessions[sessionId] = {
      id: sessionId, agentId: state.activeAgent.id,
      title: title,
      messages: [], createdAt: ts, updatedAt: ts
    };
    document.getElementById("messages").innerHTML = "";
  }

  const displayText = text || "(PDF gesendet)";
  const userMsg = { role: "user", content: displayText, ts, pdfName: pdf ? pdf.name : null };
  state.sessions[state.activeSessionId].messages.push(userMsg);
  state.sessions[state.activeSessionId].updatedAt = ts;
  appendMessage("user", displayText, ts, pdf ? pdf.name : null);
  saveToStorage();
  renderArchive();
  appendTyping();

  try {
    const agent = state.activeAgent;
    const headers = { "Content-Type": "application/json" };
    if (CONFIG.flowiseApiKey) headers["Authorization"] = "Bearer " + CONFIG.flowiseApiKey;
    const question = text || "Bitte lies und analysiere das angehängte PDF vollständig.";
    const body = { question: question, sessionId: state.activeSessionId };
    if (pdf) {
      body.uploads = [{ data: "data:application/pdf;base64," + pdf.base64, type: "file:full", name: pdf.name, mime: "application/pdf" }];
    }
    const res = await fetch(agent.flowiseUrl + agent.chatflowId, {
      method: "POST", headers,
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const answer = data.text || data.answer || data.output || JSON.stringify(data);
    removeTyping();
    const botMsg = { role: "bot", content: answer, ts: Date.now() };
    state.sessions[state.activeSessionId].messages.push(botMsg);
    state.sessions[state.activeSessionId].updatedAt = botMsg.ts;
    appendMessage("bot", answer, botMsg.ts, null);
    saveToStorage();
  } catch(err) {
    removeTyping();
    const errMsg = { role: "bot", content: "Verbindungsfehler: " + err.message, ts: Date.now() };
    state.sessions[state.activeSessionId].messages.push(errMsg);
    appendMessage("bot", errMsg.content, errMsg.ts, null);
    saveToStorage();
  }
  state.isLoading = false;
  document.getElementById("send-btn").disabled = false;
  input.focus();
}

document.getElementById("msg-input").addEventListener("input", function() {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
});
document.getElementById("msg-input").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
</script>
</body>
</html>
